        renderFilters();
        render();

    function toggleTheme() {
        const html = document.documentElement;

        safeSet("theme", next);

                    '<div class="spec-tag">📌 ' + e.spec[currentLang] + "</div>" +
                    linksHtml +
                    "</div>";
            });
            html += "</div>";
        });
