<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Історія мов програмування</title>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;
            --surface-hover: #1a1a2e;
            --card: #16162a;
            --text: #f0f0f5;
            --text-muted: #8b8ba3;
            --accent: #00e5b0;
            --accent-2: #7c3aed;
            --accent-3: #ff9f43;
            --gradient: linear-gradient(135deg, #00e5b0, #7c3aed);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 1rem;
        }
        [data-theme="light"] {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface-hover: #f0f2f8;
            --card: #ffffff;
            --text: #0f0f1a;
            --text-muted: #5a5a70;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 1rem 5% 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        [data-theme="light"] header { border-bottom: 1px solid rgba(0,0,0,0.06); }
        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .brand-area {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }
        .home-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .home-link:hover { opacity: 0.8; }
        .home-link::before { content: "← "; }
        .page-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .controls { display: flex; align-items: center; gap: 0.8rem; }
        .lang-switcher {
            display: flex; background: var(--surface-hover); border-radius: 2rem; padding: 3px;
        }
        .lang-switcher button {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.35rem 0.7rem; border-radius: 2rem; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; transition: 0.2s;
        }
        .lang-switcher button.active { background: var(--accent); color: #000; }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: var(--surface-hover); color: var(--text); cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .theme-btn:hover { transform: scale(1.1); }


        .filters {
            max-width: 1200px; margin: 1rem auto; padding: 0 5%;
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent); color: #000; border-color: var(--accent);
        }

        main {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem 5% 4rem;
        }
        .section-title {
            font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.3rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        [data-theme="light"] .card { border-color: rgba(0,0,0,0.06); }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(0,229,176,0.2);
        }
        .card-header {
            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem;
        }
        .card-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: var(--surface-hover);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .card-title { font-weight: 700; font-size: 1.05rem; }
        .card-year {
            font-size: 0.75rem; color: var(--accent-2);
            background: rgba(124,58,237,0.12);
            padding: 0.15rem 0.5rem; border-radius: 1rem;
            display: inline-block; margin-top: 0.15rem;
        }
        .card-desc {
            color: var(--text-muted); font-size: 0.9rem;
            line-height: 1.55; margin: 0.6rem 0 0.4rem; flex: 1;
        }
        .card-meta {
            font-size: 0.8rem; color: var(--text-muted); margin-top: 0.4rem;
        }
        .card-meta strong { color: var(--text); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.04em; display: block; margin-bottom: 0.15rem; }
        .card-link {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: var(--accent); text-decoration: none;
            font-weight: 600; font-size: 0.85rem;
            margin-top: 0.75rem; transition: gap 0.2s;
        }
        .card-link:hover { gap: 0.7rem; }
        .card-link::after { content: "→"; }

        .intro {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.6rem 1.8rem;
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.65;
        }
        [data-theme="light"] .intro { border-color: rgba(0,0,0,0.06); }
        .intro h2 {
            font-size: 1.35rem; margin-bottom: 0.8rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro h3 {
            font-size: 1.05rem; margin: 1.25rem 0 0.45rem; color: var(--accent);
        }
        .intro p { margin-bottom: 0.7rem; }
        .intro ul { margin: 0.4rem 0 0.8rem 1.25rem; }
        .intro li { margin-bottom: 0.35rem; }
        .intro strong { color: var(--text); }

        .no-results {
            text-align: center; color: var(--text-muted);
            padding: 3rem; font-size: 1.1rem; grid-column: 1 / -1;
        }
        footer {
            text-align: center; padding: 2rem; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.05rem; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand-area">
            <a href="index.html" class="home-link" id="home-link">Головна сторінка</a>
            <div class="page-title" id="page-title">📜 Історія мов програмування</div>
        </div>
        <div class="controls">
            <div class="lang-switcher">
                <button onclick="setLang('uk')" class="active" id="btn-uk">UA</button>
                <button onclick="setLang('ru')" id="btn-ru">RU</button>
                <button onclick="setLang('en')" id="btn-en">EN</button>
            </div>
            <button class="theme-btn" onclick="toggleTheme()" title="Theme">🌓</button>
        </div>
    </div>
    <div class="filters" id="filters"></div>
</header>

<main id="main"></main>
<footer id="footer"></footer>

const languages = [

      desc:{ uk:"Перша широко використовувана мова високого рівня. Створена для наукових і інженерних обчислень; ідея — писати формули, а не машинний код. Досі застосовується в HPC і суперкомп’ютерах.",
             ru:"Первый широко используемый язык высокого уровня. Создан для научных и инженерных вычислений; идея — писать формулы, а не машинный код. До сих пор применяется в HPC и суперкомпьютерах.",

             ru:"Язык для обработки списков и символьных вычислений. Основа раннего ИИ, макросов и функционального программирования. Повлиял на Scheme, Clojure, Emacs Lisp.",

    { id:"cobol", cat:"early", icon:"🏦", name:"COBOL", year:"1959",

    { id:"smalltalk", cat:"seventies", icon:"💬", name:"Smalltalk", year:"1972",

<p>A <strong>programming language</strong> is a formal system for writing instructions for a computer (or other computing system). It defines syntax (how to write) and semantics (what the writing means), so a human can describe an algorithm and a translator (compiler or interpreter) can turn it into machine actions.</p>

<h3>Why programming languages exist</h3>
<ul>
<li><strong>Abstraction</strong> — avoid writing zeros and ones by hand; work with variables, functions and data structures.</li>
<li><strong>Readability</strong> — code is read by people: teammates, future you, analysis tools.</li>
<li><strong>Portability</strong> — the same program text can target another architecture (given a compiler/runtime).</li>
<li><strong>Developer productivity</strong> — libraries, types and tooling reduce bugs and speed up work.</li>

<h3>How a program runs</h3>
<ul>
<li><strong>Compilation</strong> — code is turned into machine code (or bytecode) ahead of time (C, C++, Rust, Go, Java → JVM).</li>
<li><strong>Interpretation</strong> — code is executed “on the fly” (classic BASIC, many scripting languages).</li>
<li><strong>Hybrid</strong> — compile to bytecode plus a VM or JIT (Java, C#, modern JavaScript engines).</li>
</ul>

<h3>Paradigms (ways of thinking)</h3>
<ul>
<li><strong>Imperative</strong> — sequences of commands that change state (C, Pascal).</li>
<li><strong>Object-oriented</strong> — objects, classes, messages (Smalltalk, Java, C#).</li>
<li><strong>Functional</strong> — functions without side effects, composition (Haskell, parts of Lisp, F#).</li>
<li><strong>Logic</strong> — facts and rules (Prolog).</li>
<li><strong>Multi-paradigm</strong> — mixtures of the above (Python, Scala, Rust, JavaScript).</li>
</ul>

<h3>Levels of abstraction</h3>
<p>From <strong>machine code</strong> and <strong>assembly</strong> (close to the CPU) to <strong>high-level</strong> languages (close to the human problem) and <strong>domain-specific</strong> languages (SQL, markup languages, AI pipeline DSLs).</p>

let currentLang = localStorage.getItem('lang-hist-pl') || 'uk';
let activeCategory = 'about';

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('lang-hist-pl', lang);
    document.documentElement.lang = lang === 'uk' ? 'uk' : (lang === 'ru' ? 'ru' : 'en');
    ['uk','ru','en'].forEach(l => document.getElementById('btn-'+l).classList.toggle('active', l===lang));
    document.title = ui[lang].title;
    document.getElementById('home-link').textContent = ui[lang].home;
    document.getElementById('page-title').textContent = ui[lang].pageTitle;
    renderFilters();
    render();
}

function toggleTheme() {
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    html.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
    localStorage.setItem('theme', cur === 'light' ? 'dark' : 'light');
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

function renderFilters() {
    const container = document.getElementById('filters');
    let html = `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="setCat('all')">${ui[currentLang].all}</button>`;
    html += `<button class="filter-btn ${activeCategory==='whatis'?'active':''}" onclick="setCat('whatis')">${ui[currentLang].whatis}</button>`;
    html += `<button class="filter-btn ${activeCategory==='about'?'active':''}" onclick="setCat('about')">${ui[currentLang].about}</button>`;
    for (const [key, val] of Object.entries(categories)) {
        html += `<button class="filter-btn ${activeCategory===key?'active':''}" onclick="setCat('${key}')">${val[currentLang]}</button>`;
    }
    html += `<button class="filter-btn ${activeCategory==='future'?'active':''}" onclick="setCat('future')">${ui[currentLang].future}</button>`;
    container.innerHTML = html;
}

function setCat(cat) {
    activeCategory = cat;
    renderFilters();
    render();
}

function render() {
    const main = document.getElementById('main');

    if (activeCategory === 'about' || activeCategory === 'whatis' || activeCategory === 'future') {
        const src = activeCategory === 'whatis' ? whatIsLang : (activeCategory === 'future' ? futureAI : overview);
        const o = src[currentLang];
        main.innerHTML = `<div class="intro"><h2>${o.title}</h2>${o.body}</div>`;
        document.getElementById('footer').textContent = ui[currentLang].footer;
        return;
    }

    let html = '';
    const catsToShow = activeCategory === 'all' ? Object.keys(categories) : [activeCategory];

    catsToShow.forEach(catKey => {
        const items = languages.filter(L => L.cat === catKey);
        if (items.length === 0) return;
        html += `<div class="section-title">${categories[catKey][currentLang]}</div><div class="grid">`;
        items.forEach(L => {
            html += `
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">${L.icon}</div>
                        <div>
                            <div class="card-title">${L.name}</div>
                            <span class="card-year">${L.year}</span>
                        </div>
                    </div>
                    <div class="card-desc">${L.desc[currentLang]}</div>
                    <div class="card-meta">
                        <strong>${ui[currentLang].author}</strong>
                        ${L.author[currentLang]}
                    </div>
                    ${L.url ? `<a href="${L.url}" target="_blank" rel="noopener" class="card-link">${ui[currentLang].open}</a>` : ''}
                </div>`;
        });
        html += `</div>`;
    });

    if (html === '') html = `<div class="no-results">${ui[currentLang].noResults}</div>`;
    main.innerHTML = html;
    document.getElementById('footer').textContent = ui[currentLang].footer;
}
