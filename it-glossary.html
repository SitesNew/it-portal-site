<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Глосарій термінів ІТ — Довідник</title>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;
            --surface-hover: #1a1a2e;
            --card: #16162a;
            --text: #f0f0f5;
            --text-muted: #8b8ba3;
            --accent: #27ae60;
            --accent-2: #2196f3;
            --gradient: linear-gradient(135deg, #27ae60, #2196f3);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 1rem;
        }
        [data-theme="light"] {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface-hover: #f0f2f8;
            --card: #ffffff;
            --text: #0f0f1a;
            --text-muted: #5a5a70;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 1rem 5% 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        [data-theme="light"] header { border-bottom: 1px solid rgba(0,0,0,0.06); }
        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .brand-area {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }
        .home-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .home-link:hover { opacity: 0.8; }
        .home-link::before { content: "← "; }
        .page-title {
            font-size: 1.2rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .controls { display: flex; align-items: center; gap: 0.8rem; }
        .lang-switcher {
            display: flex; background: var(--surface-hover); border-radius: 2rem; padding: 3px;
        }
        .lang-switcher button {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.35rem 0.7rem; border-radius: 2rem; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; transition: 0.2s;
        }
        .lang-switcher button.active { background: var(--accent); color: #fff; }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: var(--surface-hover); color: var(--text); cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .theme-btn:hover { transform: scale(1.1); }

        .filters {
            max-width: 1200px; margin: 1rem auto; padding: 0 5%;
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent); color: #fff; border-color: var(--accent);
        }

        .search-wrap {
            max-width: 1200px; margin: 0.5rem auto 0; padding: 0 5%;
        }
        .search-input {
            width: 100%;
            max-width: 420px;
            padding: 0.55rem 1rem;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--surface);
            color: var(--text);
            font-size: 0.9rem;
            outline: none;
        }
        .search-input:focus {
            border-color: var(--accent);
        }
        [data-theme="light"] .search-input {
            border-color: rgba(0,0,0,0.12);
        }

        main {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem 5% 4rem;
        }

        .intro {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: var(--radius);
            padding: 1.5rem 1.6rem;
            margin-bottom: 1.5rem;
            line-height: 1.65;
        }
        [data-theme="light"] .intro { border-color: rgba(0,0,0,0.06); }
        .intro h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin-bottom: 0.6rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 0.55rem;
        }
        .intro p:last-child { margin-bottom: 0; }

        .section-title {
            font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.3rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        [data-theme="light"] .card { border-color: rgba(0,0,0,0.06); }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(39,174,96,0.4);
        }
        .card-header {
            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.5rem;
        }
        .card-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: var(--surface-hover);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .card-title { font-weight: 700; font-size: 1.05rem; }
        .card-desc {
            color: var(--text-muted); font-size: 0.9rem;
            line-height: 1.55; margin: 0.5rem 0; flex: 1;
        }
        .card-meta {
            font-size: 0.8rem; color: var(--text-muted); margin-top: 0.3rem;
        }
        .card-meta strong {
            color: var(--text); font-size: 0.72rem; text-transform: uppercase;
            letter-spacing: 0.04em; display: block; margin-bottom: 0.15rem;
        }
        .tag {
            display: inline-block;
            background: rgba(39,174,96,0.15); color: var(--accent);
            padding: 0.15rem 0.5rem; border-radius: 0.5rem;
            font-size: 0.75rem; font-weight: 600; margin: 0.1rem 0.15rem 0 0;
        }
        .spec-tag {
            display: inline-block;
            background: rgba(33,150,243,0.12); color: var(--accent-2);
            padding: 0.15rem 0.5rem; border-radius: 0.5rem;
            font-size: 0.75rem; font-weight: 700; margin-top: 0.6rem;
        }

        .mfg-links {
            margin-top: 0.8rem;
            padding-top: 0.8rem;
            border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; flex-wrap: wrap; gap: 0.4rem;
        }
        .mfg-link {
            color: var(--text);
            background: var(--surface-hover);
            text-decoration: none;
            padding: 0.2rem 0.55rem;
            border-radius: 0.4rem;
            font-size: 0.75rem;
            font-weight: 600;
            transition: 0.2s;
        }
        .mfg-link:hover {
            background: var(--accent);
            color: #fff;
        }

        footer {
            text-align: center; padding: 2rem; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem;
        }
        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.02rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="header-top">
        <div class="brand-area">
            <a href="index.html" class="home-link" id="home-link">Головна сторінка</a>
            <div class="page-title" id="page-title">📖 Глосарій термінів ІТ</div>
        </div>
        <div class="controls">
            <div class="lang-switcher">
                <button type="button" onclick="setLang('uk')" class="active" id="btn-uk">UA</button>
                <button type="button" onclick="setLang('ru')" id="btn-ru">RU</button>
                <button type="button" onclick="setLang('en')" id="btn-en">EN</button>
            </div>
            <button type="button" class="theme-btn" onclick="toggleTheme()" title="Theme">🌓</button>
        </div>
    </div>
    <div class="filters" id="filters"></div>
    <div class="search-wrap">
        <input type="search" class="search-input" id="search" placeholder="Пошук терміна..." oninput="onSearch()">
    </div>
</header>

<main id="main"></main>
<footer id="footer"></footer>

    let currentLang = safeGet("lang-glossary", "uk");
    let activeCategory = "all";
    let searchQuery = "";

    function setLang(lang) {
        if (!ui[lang]) return;
        currentLang = lang;
        safeSet("lang-glossary", lang);
        document.documentElement.lang = lang === "uk" ? "uk" : (lang === "ru" ? "ru" : "en");
        ["uk", "ru", "en"].forEach(function (l) {
            const btn = document.getElementById("btn-" + l);
            if (btn) btn.classList.toggle("active", l === lang);
        });
        document.title = ui[lang].title;
        const home = document.getElementById("home-link");
        if (home) home.textContent = ui[lang].home;
        const title = document.getElementById("page-title");
        if (title) title.textContent = ui[lang].pageTitle;
        const search = document.getElementById("search");
        if (search) search.placeholder = ui[lang].searchPlaceholder;
        renderFilters();
        render();
    }

    function toggleTheme() {
        const html = document.documentElement;
        const cur = html.getAttribute("data-theme");
        const next = cur === "light" ? "dark" : "light";
        html.setAttribute("data-theme", next);
        safeSet("theme", next);
    }

    document.documentElement.setAttribute("data-theme", safeGet("theme", "dark"));

    function renderFilters() {
        const c = document.getElementById("filters");
        if (!c) return;
        let h = '<button type="button" class="filter-btn ' + (activeCategory === "all" ? "active" : "") + '" onclick="setCat(\'all\')">' + ui[currentLang].all + "</button>";
        for (const k in categories) {
            if (!categories.hasOwnProperty(k)) continue;
            h += '<button type="button" class="filter-btn ' + (activeCategory === k ? "active" : "") + '" onclick="setCat(\'' + k + '\')">' + categories[k][currentLang] + "</button>";
        }
        c.innerHTML = h;
    }

    function setCat(cat) {
        activeCategory = cat;
        renderFilters();
        render();
    }

    function onSearch() {
        const el = document.getElementById("search");
        searchQuery = el ? (el.value || "").trim().toLowerCase() : "";
        render();
    }

    function matchesSearch(e) {
        if (!searchQuery) return true;
        const name = (e.name[currentLang] || "").toLowerCase();
        const desc = (e.desc[currentLang] || "").toLowerCase();
        const traits = (e.traits[currentLang] || "").toLowerCase();
        return name.indexOf(searchQuery) !== -1 || desc.indexOf(searchQuery) !== -1 || traits.indexOf(searchQuery) !== -1;
    }

    function render() {
        const main = document.getElementById("main");
        if (!main) return;
        let html = "";

        html += '<div class="intro"><h2>' + ui[currentLang].introTitle + "</h2>" +
            "<p>" + ui[currentLang].intro1 + "</p>" +
            "<p>" + ui[currentLang].intro2 + "</p></div>";

        const cats = activeCategory === "all" ? Object.keys(categories) : [activeCategory];
        let any = false;

        cats.forEach(function (catKey) {
            const list = items.filter(function (e) {
                return e.cat === catKey && matchesSearch(e);
            });
            if (!list.length) return;
            any = true;
            html += '<div class="section-title">' + categories[catKey][currentLang] + '</div><div class="grid">';
            list.forEach(function (e) {
                const tags = e.traits[currentLang].split(",").map(function (t) {
                    return '<span class="tag">' + t.trim() + "</span>";
                }).join("");

                let linksHtml = "";
                if (e.links && e.links.length) {
                    linksHtml = '<div class="mfg-links"><strong style="width:100%;font-size:0.7rem;color:var(--text-muted);margin-bottom:2px;">' +
                        ui[currentLang].mfgText + "</strong>";
                    e.links.forEach(function (l) {
                        linksHtml += '<a href="' + l.url + '" target="_blank" rel="noopener" class="mfg-link">🔗 ' + l.name + "</a>";
                    });
                    linksHtml += "</div>";
                }

                html += '<div class="card">' +
                    '<div class="card-header"><div class="card-icon">' + e.icon + '</div>' +
                    '<div class="card-title">' + e.name[currentLang] + "</div></div>" +
                    '<div class="card-desc">' + e.desc[currentLang] + "</div>" +
                    '<div class="card-meta"><strong>' + ui[currentLang].traits + "</strong>" +
                    '<div style="margin-top:0.25rem">' + tags + "</div></div>" +
                    '<div class="spec-tag">📌 ' + e.spec[currentLang] + "</div>" +
                    linksHtml +
                    "</div>";
            });
            html += "</div>";
        });

        if (!any) {
            html += '<div class="intro"><p>' + ui[currentLang].noResults + "</p></div>";
        }

        main.innerHTML = html;
        const footer = document.getElementById("footer");
        if (footer) footer.textContent = ui[currentLang].footer;
    }

    window.setLang = setLang;
    window.setCat = setCat;
    window.toggleTheme = toggleTheme;
    window.onSearch = onSearch;

    setLang(currentLang);
})();
