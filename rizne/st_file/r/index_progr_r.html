<!DOCTYPE html>
<html lang="uk">
<head>

    <title>ProgLang Directory — Довідник мов програмування (не веб)</title>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;

            --text: #f0f0f5;
            --text-muted: #8b8ba3;
            --accent: #00e5b0;
            --accent-2: #7c3aed;
            --accent-3: #ff9f43;
            --gradient: linear-gradient(135deg, #00e5b0, #7c3aed);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 1rem;
        }
        [data-theme="light"] {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface-hover: #f0f2f8;
            --card: #ffffff;
            --text: #0f0f1a;
            --text-muted: #5a5a70;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 1.2rem 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        [data-theme="light"] header { border-bottom: 1px solid rgba(0,0,0,0.06); }
        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .brand {
            font-size: 1.4rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .brand span { font-weight: 400; font-size: 0.9rem; color: var(--text-muted); -webkit-text-fill-color: var(--text-muted); }
        .controls { display: flex; align-items: center; gap: 0.8rem; }
        .lang-switcher {
            display: flex; background: var(--surface-hover); border-radius: 2rem; padding: 3px;
        }
        .lang-switcher button {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.35rem 0.7rem; border-radius: 2rem; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; transition: 0.2s;
        }
        .lang-switcher button.active { background: var(--accent); color: #000; }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: var(--surface-hover); color: var(--text); cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .theme-btn:hover { transform: scale(1.1); }

        .search-wrap {
            max-width: 1200px; margin: 1.5rem auto 0; padding: 0 5%;
        }
        .search-box {
            width: 100%; padding: 0.9rem 1.2rem; border-radius: var(--radius);
            border: 1px solid rgba(255,255,255,0.08); background: var(--bg);
            color: var(--text); font-size: 1rem; outline: none;
            transition: border-color 0.2s;
        }
        .search-box:focus { border-color: var(--accent); }
        [data-theme="light"] .search-box { border-color: rgba(0,0,0,0.1); }
        .search-box::placeholder { color: var(--text-muted); }

        .filters {
            max-width: 1200px; margin: 1rem auto; padding: 0 5%;
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent); color: #000; border-color: var(--accent);
        }

        main {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem 5% 4rem;
        }
        .section-title {
            font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.3rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        [data-theme="light"] .card { border-color: rgba(0,0,0,0.06); }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(0,229,176,0.2);
        }
        .card-header {
            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.7rem;
        }
        .card-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: var(--surface-hover);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0;
        }
        .card-title {
            font-weight: 700; font-size: 1.05rem;
        }
        .card-desc {
            color: var(--text-muted); font-size: 0.9rem;
            line-height: 1.5; margin-bottom: 0.3rem;
        }
        .card-section {
            margin-top: 0.7rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .card-section strong {
            color: var(--text);
            display: block;
            margin-bottom: 0.15rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .tag {
            display: inline-block;
            background: rgba(124,58,237,0.1); color: var(--accent-2);
            padding: 0.15rem 0.5rem; border-radius: 0.5rem;
            font-size: 0.75rem; font-weight: 600; margin-top: 0.2rem;
        }
        .usage-tag {
            display: inline-block;
            background: rgba(0,229,176,0.1); color: var(--accent);
            padding: 0.2rem 0.6rem; border-radius: 0.5rem;
            font-size: 0.78rem; font-weight: 600; margin: 0.15rem 0.15rem 0 0;
        }
        .card-link {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: var(--accent); text-decoration: none;
            font-weight: 600; font-size: 0.85rem;
            transition: gap 0.2s; margin-top: 0.8rem;
        }
        .card-link:hover { gap: 0.7rem; }
        .card-link::after { content: "→"; }

        .no-results {
            text-align: center; color: var(--text-muted);
            padding: 3rem; font-size: 1.1rem; grid-column: 1 / -1;
        }

        footer {
            text-align: center; padding: 2rem; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .brand span { display: block; margin-top: 0.2rem; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
    </style>
</head>

</header>

<main id="main"></main>

let currentLang = localStorage.getItem('proglang-dir-lang') || 'uk';
let activeCategory = 'all';

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('proglang-dir-lang', lang);
    document.documentElement.lang = lang === 'uk' ? 'uk' : (lang === 'ru' ? 'ru' : 'en');
    ['uk','ru','en'].forEach(l => document.getElementById('btn-'+l).classList.toggle('active', l===lang));
    document.getElementById('search').placeholder = ui[lang].searchPlaceholder;
    document.title = ui[lang].title;
    renderFilters();
    render();
}

function toggleTheme() {
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    html.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
    localStorage.setItem('theme', cur === 'light' ? 'dark' : 'light');
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

function renderFilters() {
    const container = document.getElementById('filters');
    let html = `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="setCat('all')">${ui[currentLang].all}</button>`;
    for (const [key, val] of Object.entries(categories)) {
        html += `<button class="filter-btn ${activeCategory===key?'active':''}" onclick="setCat('${key}')">${val[currentLang]}</button>`;
    }
    container.innerHTML = html;
}

function setCat(cat) {
    activeCategory = cat;
    renderFilters();
    render();
}

function render() {
    const query = document.getElementById('search').value.toLowerCase();
    const main = document.getElementById('main');
    let html = '';

    const catsToShow = activeCategory === 'all' ? Object.keys(categories) : [activeCategory];

    catsToShow.forEach(catKey => {
        const catItems = langList.filter(l => {
            if (l.cat !== catKey) return false;
            if (!query) return true;
            return l.name.toLowerCase().includes(query) || l.desc[currentLang].toLowerCase().includes(query);
        });

        if (catItems.length === 0) return;

        html += `<div class="section-title">${categories[catKey][currentLang]}</div>`;
        html += `<div class="grid">`;
        catItems.forEach(l => {
            const usageTags = l.usage.split(',').map(u => `<span class="usage-tag">${u.trim()}</span>`).join('');
            html += `
                <div class="card">
                    <div class="card-header">
                        <div class="card-icon">${l.icon}</div>
                        <div>
                            <div class="card-title">${l.name}</div>
                        </div>
                    </div>
                    <div class="card-desc">${l.desc[currentLang]}</div>
                    
                    <div class="card-section">
                        <strong>${ui[currentLang].features}</strong>
                        ${l.features[currentLang]}
                    </div>
                    
                    <div class="card-section">
                        <strong>${ui[currentLang].paradigm}</strong>
                        <div class="tag">${l.paradigm[currentLang]}</div>
                    </div>
                    
                    <div class="card-section">
                        <strong>${ui[currentLang].usage}</strong>
                        <div style="margin-top:0.3rem">${usageTags}</div>
                    </div>
                    
                    <a href="${l.url}" target="_blank" class="card-link">${ui[currentLang].open}</a>
                </div>
            `;
        });
        html += `</div>`;
    });

    if (html === '') {
        html = `<div class="no-results">${ui[currentLang].noResults}</div>`;
    }

    main.innerHTML = html;
    document.getElementById('footer').textContent = ui[currentLang].footer;
}
