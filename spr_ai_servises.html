<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Довідник сервісів Штучного Інтелекту</title>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;
            --surface-hover: #1a1a2e;
            --card: #16162a;
            --text: #f0f0f5;
            --text-muted: #8b8ba3;
            --accent: #00e5b0;
            --accent-2: #7c3aed;
            --accent-3: #ff6b6b;
            --gradient: linear-gradient(135deg, #00e5b0, #7c3aed);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 1rem;
        }
        [data-theme="light"] {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface-hover: #f0f2f8;
            --card: #ffffff;
            --text: #0f0f1a;
            --text-muted: #5a5a70;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        /* Header */
        header {
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 1rem 5% 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        [data-theme="light"] header { border-bottom: 1px solid rgba(0,0,0,0.06); }
        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .brand-area {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }
        .home-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .home-link:hover { opacity: 0.8; }
        .home-link::before { content: "← "; }
        .page-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro {
            max-width: 1200px;
            margin: 1.5rem auto 0;
            padding: 1.3rem 1.5rem;
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.65;
        }
        [data-theme="light"] .intro { border-color: rgba(0,0,0,0.06); }
        .intro strong { color: var(--text); }
        .intro h2 {
            font-size: 1.15rem;
            margin-bottom: 0.6rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .intro ul { margin: 0.5rem 0 0.8rem 1.2rem; }
        .intro li { margin-bottom: 0.35rem; }
        .intro h3 {
            font-size: 1.05rem;
            margin: 1.2rem 0 0.45rem;
            color: var(--accent);
        }
        .intro p { margin-bottom: 0.7rem; }
        main .intro {
            margin: 0;
            max-width: none;
        }
        .controls { display: flex; align-items: center; gap: 0.8rem; }
        .lang-switcher {
            display: flex; background: var(--surface-hover); border-radius: 2rem; padding: 3px;
        }
        .lang-switcher button {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.35rem 0.7rem; border-radius: 2rem; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; transition: 0.2s;
        }
        .lang-switcher button.active { background: var(--accent); color: #000; }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: var(--surface-hover); color: var(--text); cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .theme-btn:hover { transform: scale(1.1); }

        /* Filters */
        .filters {
            max-width: 1200px; margin: 1rem auto; padding: 0 5%;
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent); color: #000; border-color: var(--accent);
        }

        /* Grid */
        main {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem 5% 4rem;
        }
        .section-title {
            font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.2rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        [data-theme="light"] .card { border-color: rgba(0,0,0,0.06); }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(0,229,176,0.2);
        }
        .card-header {
            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.6rem;
        }
        .card-icon {
            width: 42px; height: 42px; border-radius: 10px;
            background: var(--surface-hover);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .card-title {
            font-weight: 700; font-size: 1rem;
        }
        .card-tag {
            font-size: 0.7rem; color: var(--accent-2);
            background: rgba(124,58,237,0.1);
            padding: 0.15rem 0.5rem; border-radius: 1rem;
            display: inline-block; margin-top: 0.2rem;
        }
        .card-desc {
            color: var(--text-muted); font-size: 0.88rem;
            margin: 0.6rem 0 1rem; line-height: 1.5; flex: 1;
        }
        .card-link {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: var(--accent); text-decoration: none;
            font-weight: 600; font-size: 0.85rem;
            transition: gap 0.2s;
        }
        .card-link:hover { gap: 0.7rem; }
        .card-link::after { content: "→"; }

        .no-results {
            text-align: center; color: var(--text-muted);
            padding: 3rem; font-size: 1.1rem; grid-column: 1 / -1;
        }

        /* Footer */
        footer {
            text-align: center; padding: 2rem; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.05rem; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
    </style>
</head>

</ul>

<h3>Рівні «інтелекту»</h3>
<ul>
<li><strong>Вузький (або слабкий) ШІ</strong> — спеціалізовані системи під конкретну задачу (переклад, розпізнавання облич, рекомендації). Саме такі системи ми використовуємо щодня.</li>

<li><strong>Продуктивність</strong> — нотатки, презентації, листи, протоколи зустрічей, SEO-тексти.</li>

let currentLang = localStorage.getItem('ai-dir-lang') || 'uk';

    currentLang = lang;
    localStorage.setItem('ai-dir-lang', lang);
    document.documentElement.lang = lang === 'uk' ? 'uk' : (lang === 'ru' ? 'ru' : 'en');
    ['uk','ru','en'].forEach(l => document.getElementById('btn-'+l).classList.toggle('active', l===lang));

    document.getElementById('home-link').textContent = ui[lang].home;
    document.getElementById('page-title').textContent = ui[lang].pageTitle;
    renderFilters();
    render();
}

function toggleTheme() {
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    html.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
    localStorage.setItem('theme', cur === 'light' ? 'dark' : 'light');
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

function renderFilters() {
    const container = document.getElementById('filters');
    let html = `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="setCat('all')">${ui[currentLang].all}</button>`;
    html += `<button class="filter-btn ${activeCategory==='about'?'active':''}" onclick="setCat('about')">${ui[currentLang].about}</button>`;
    for (const [key, val] of Object.entries(categories)) {
        html += `<button class="filter-btn ${activeCategory===key?'active':''}" onclick="setCat('${key}')">${val[currentLang]}</button>`;
    }
    container.innerHTML = html;
}

function setCat(cat) {
    activeCategory = cat;
    renderFilters();
    render();
}

function render() {
    const main = document.getElementById('main');
    let html = '';

    if (activeCategory === 'about') {
        const block = introContent[currentLang];
        main.innerHTML = `<div class="intro"><h2>${block.title}</h2>${block.body}</div>`;
        document.getElementById('footer').textContent = ui[currentLang].footer;
        return;

    const catsToShow = activeCategory === 'all' ? Object.keys(categories) : [activeCategory];

    catsToShow.forEach(catKey => {

        if (catServices.length === 0) return;

        html += `<div class="section-title">${categories[catKey][currentLang]}</div>`;

                        <div>

                    <div class="card-desc">${s.desc[currentLang]}</div>
                    <a href="${s.url}" target="_blank" class="card-link">${ui[currentLang].open}</a>

            `;
        });
        html += `</div>`;
    });

    if (html === '') {
        html = `<div class="no-results">${ui[currentLang].noResults}</div>`;
    }

    main.innerHTML = html;
    document.getElementById('footer').textContent = ui[currentLang].footer;
}
