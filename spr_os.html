<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Довідник операційних систем</title>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;
            --surface-hover: #1a1a2e;
            --card: #16162a;
            --text: #f0f0f5;
            --text-muted: #8b8ba3;
            --accent: #00e5b0;
            --accent-2: #7c3aed;
            --accent-3: #ff9f43;
            --gradient: linear-gradient(135deg, #00e5b0, #7c3aed);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 1rem;
        }
        [data-theme="light"] {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface-hover: #f0f2f8;
            --card: #ffffff;
            --text: #0f0f1a;
            --text-muted: #5a5a70;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 1rem 5% 0.8rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        [data-theme="light"] header { border-bottom: 1px solid rgba(0,0,0,0.06); }
        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }
        .brand-area {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            flex-wrap: wrap;
        }
        .home-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            white-space: nowrap;
            transition: opacity 0.2s;
        }
        .home-link:hover { opacity: 0.8; }
        .home-link::before { content: "← "; }
        .page-title {
            font-size: 1.25rem;
            font-weight: 800;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .controls { display: flex; align-items: center; gap: 0.8rem; }
        .lang-switcher {
            display: flex; background: var(--surface-hover); border-radius: 2rem; padding: 3px;
        }
        .lang-switcher button {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.35rem 0.7rem; border-radius: 2rem; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; transition: 0.2s;
        }
        .lang-switcher button.active { background: var(--accent); color: #000; }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: var(--surface-hover); color: var(--text); cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .theme-btn:hover { transform: scale(1.1); }

        .nav-menu {
            max-width: 1200px;
            margin: 0.9rem auto 0;
            padding: 0 5%;
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .nav-menu a {
            padding: 0.4rem 0.85rem;
            border-radius: 2rem;
            border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface-hover);
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: 0.2s;
            white-space: nowrap;
        }
        [data-theme="light"] .nav-menu a { border-color: rgba(0,0,0,0.08); }
        .nav-menu a:hover {
            background: var(--accent);
            color: #000;
            border-color: var(--accent);
        }


        .filters {
            max-width: 1200px; margin: 1rem auto; padding: 0 5%;
            display: flex; gap: 0.5rem; flex-wrap: wrap;
        }
        .filter-btn {
            padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent); color: #000; border-color: var(--accent);
        }

        main {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem 5% 4rem;
        }
        .section-title {
            font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        .card {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.3rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        [data-theme="light"] .card { border-color: rgba(0,0,0,0.06); }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(0,229,176,0.2);
        }
        .card-header {
            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.7rem;
        }
        .card-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: var(--surface-hover);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0;
        }
        .card-title {
            font-weight: 700; font-size: 1.05rem;
        }
        .card-desc {
            color: var(--text-muted); font-size: 0.9rem;
            line-height: 1.5; margin-bottom: 0.3rem;
        }
        .card-section {
            margin-top: 0.7rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .card-section strong {
            color: var(--text);
            display: block;
            margin-bottom: 0.15rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .arch-tags {
            display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.3rem;
        }
        .arch-tag {
            background: rgba(0,229,176,0.1); color: var(--accent);
            padding: 0.15rem 0.5rem; border-radius: 0.5rem;
            font-size: 0.75rem; font-weight: 600;
        }
        .card-link {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: var(--accent); text-decoration: none;
            font-weight: 600; font-size: 0.85rem;
            transition: gap 0.2s; margin-top: 0.8rem;
        }
        .card-link:hover { gap: 0.7rem; }
        .card-link::after { content: "→"; }

        .license-free { color: #00e5b0; }
        .license-paid { color: #ff9f43; }
        .license-mix { color: #7c3aed; }

        .no-results {
            text-align: center; color: var(--text-muted);
            padding: 3rem; font-size: 1.1rem; grid-column: 1 / -1;
        }

        .extra-section {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.8rem;
            margin: 2.5rem auto;
            max-width: 1200px;
            scroll-margin-top: 140px;
        }
        [data-theme="light"] .extra-section { border-color: rgba(0,0,0,0.06); }
        .extra-section h2 {
            font-size: 1.4rem;
            margin-bottom: 1rem;
            background: var(--gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .extra-section h3 {
            font-size: 1.1rem;
            margin: 1.4rem 0 0.5rem;
            color: var(--accent);
        }
        .extra-section p, .extra-section li {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.65;
            margin-bottom: 0.7rem;
        }
        .extra-section ul { padding-left: 1.4rem; margin-bottom: 0.8rem; }
        .extra-section strong { color: var(--text); }
        .extra-section a {
            color: var(--accent);
            text-decoration: none;
            border-bottom: 1px solid rgba(0,229,176,0.35);
        }
        .extra-section a:hover { border-bottom-color: var(--accent); }
        .extra-section {
            margin-top: 0;
        }

        footer {
            text-align: center; padding: 2rem; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .page-title { font-size: 1.05rem; }
            .nav-menu a { font-size: 0.75rem; padding: 0.35rem 0.7rem; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
    </style>
</head>

            </div>
            <button class="theme-btn" onclick="toggleTheme()" title="Theme">🌓</button>
        </div>
    </div>
    <div class="filters" id="filters"></div>
</header>

<main id="main"></main>


<footer id="footer"></footer>

    msdos: {
        uk: { title: "📜 Історичний екскурс: MS-DOS", body: `<p><strong>MS-DOS</strong> (Microsoft Disk Operating System) — операційна система, яка в 1980-х роках зробила справжню революцію на ринку персональних комп’ютерів.</p><h3>Як з’явилася</h3><p>У 1980 році Seattle Computer Products створила <strong>QDOS</strong> (Quick and Dirty Operating System) для процесора Intel 8086. Microsoft придбала права на неї, адаптувала під вимоги IBM і випустила як <strong>PC-DOS 1.0</strong> разом із IBM PC у серпні 1981 року. Паралельно Microsoft продавала систему іншим виробникам як <strong>MS-DOS</strong>.</p><h3>Чому це була революція</h3><ul><li>Відкрита архітектура IBM PC + MS-DOS дозволила з’явитися тисячам сумісних «клонів» (Compaq, Dell та ін.).</li><li>Єдиний програмний стандарт зробив можливим масове поширення програм (WordStar, Lotus 1-2-3, dBase тощо).</li><li>Командний рядок і файлова система FAT стали базою для цілого покоління користувачів і розробників.</li><li>Саме MS-DOS забезпечила Microsoft домінуючу позицію на ринку ПЗ і проклала шлях до Windows.</li></ul><h3>Еволюція</h3><p>Версії 1.x–6.x (1981–1993) додавали підтримку жорстких дисків, каталогів, мереж, розширеної пам’яті. Windows 95 ще містила MS-DOS 7.0, але з Windows NT і XP система остаточно відійшла в минуле як основна платформа. Сьогодні MS-DOS живе в емуляторах, вбудованих системах і ностальгійних проектах (FreeDOS).</p>` },
        ru: { title: "📜 Исторический экскурс: MS-DOS", body: `<p><strong>MS-DOS</strong> (Microsoft Disk Operating System) — операционная система, которая в 1980-х годах совершила настоящую революцию на рынке персональных компьютеров.</p><h3>Как появилась</h3><p>В 1980 году Seattle Computer Products создала <strong>QDOS</strong> (Quick and Dirty Operating System) для процессора Intel 8086. Microsoft приобрела права на неё, адаптировала под требования IBM и выпустила как <strong>PC-DOS 1.0</strong> вместе с IBM PC в августе 1981 года. Параллельно Microsoft продавала систему другим производителям как <strong>MS-DOS</strong>.</p><h3>Почему это была революция</h3><ul><li>Открытая архитектура IBM PC + MS-DOS позволила появиться тысячам совместимых «клонов» (Compaq, Dell и др.).</li><li>Единый программный стандарт сделал возможным массовое распространение программ (WordStar, Lotus 1-2-3, dBase и т.д.).</li><li>Командная строка и файловая система FAT стали базой для целого поколения пользователей и разработчиков.</li><li>Именно MS-DOS обеспечила Microsoft доминирующую позицию на рынке ПО и проложила путь к Windows.</li></ul><h3>Эволюция</h3><p>Версии 1.x–6.x (1981–1993) добавляли поддержку жёстких дисков, каталогов, сетей, расширенной памяти. Windows 95 ещё содержала MS-DOS 7.0, но с Windows NT и XP система окончательно ушла в прошлое как основная платформа. Сегодня MS-DOS живёт в эмуляторах, встроенных системах и ностальгических проектах (FreeDOS).</p>` },
        en: { title: "📜 Historical excursion: MS-DOS", body: `<p><strong>MS-DOS</strong> (Microsoft Disk Operating System) was the operating system that truly revolutionized the personal computer market in the 1980s.</p><h3>How it appeared</h3><p>In 1980 Seattle Computer Products created <strong>QDOS</strong> (Quick and Dirty Operating System) for the Intel 8086. Microsoft acquired the rights, adapted it for IBM and released it as <strong>PC-DOS 1.0</strong> with the IBM PC in August 1981. Microsoft also sold the system to other manufacturers as <strong>MS-DOS</strong>.</p><h3>Why it was a revolution</h3><ul><li>The open IBM PC architecture + MS-DOS enabled thousands of compatible “clones” (Compaq, Dell and others).</li><li>A single software standard made mass distribution of applications possible (WordStar, Lotus 1-2-3, dBase, etc.).</li><li>The command line and FAT file system became the foundation for a whole generation of users and developers.</li><li>MS-DOS secured Microsoft’s dominant position in software and paved the way for Windows.</li></ul><h3>Evolution</h3><p>Versions 1.x–6.x (1981–1993) added hard-disk support, directories, networking and expanded memory. Windows 95 still included MS-DOS 7.0, but with Windows NT and XP the system ceased to be the primary platform. Today MS-DOS lives on in emulators, embedded systems and nostalgic projects (FreeDOS).</p>` }

    sov: {
        uk: { title: "📜 Операційні системи малих ЕОМ часів СРСР", body: `<p>У 1970–80-х роках у СРСР широко використовувалися міні-ЕОМ сімейства <strong>СМ ЕВМ</strong> (Система малих ЕОМ) та комплекси на базі <strong>М-6000</strong>. Багато з них були функціональними аналогами західних машин (зокрема PDP-11).</p><h3>Апаратна база</h3><ul><li><strong>М-6000</strong> — керуючі обчислювальні комплекси.</li><li><strong>СМ-1, СМ-2</strong> — ранні моделі сімейства.</li><li><strong>СМ-3, СМ-4</strong> — найбільш масові 16-розрядні міні-ЕОМ з інтерфейсом «Загальна шина» (аналог Unibus).</li></ul><h3>Основні операційні системи</h3><ul><li><strong>ОУС</strong> (Основна керуюча система) — однозадачний режим роботи.</li><li><strong>ДОС АСПО</strong> / дискові ОС з пакету АСПО — підготовка, налагодження та виконання програм у пакетному й діалоговому режимах.</li><li><strong>ДОС РВ / ДОСРВ</strong> (Дискова операційна система реального часу) — одночасна робота в багатозадачному режимі реального часу та діалогово-пакетній обробці.</li><li><strong>ОС РВ / ОСРВ</strong> (Операційна система реального часу) та її модифікації (ОСРВ-3, ОСРВ-4, СРВ, СРВ-М) — багатозадачні системи реального часу, здатні обслуговувати десятки задач з пріоритетами.</li><li>Також існували ПЛОС, РАФОС, ДОС КП, ДЕМОС-16 (UNIX-подібна) та інші спеціалізовані системи.</li></ul><p>Ці ОС забезпечували керування технологічними процесами, наукові розрахунки, системи збору даних і були важливою частиною промислової та військової автоматизації СРСР.</p>` },
        ru: { title: "📜 Операционные системы малых ЭВМ времён СССР", body: `<p>В 1970–80-х годах в СССР широко использовались мини-ЭВМ семейства <strong>СМ ЭВМ</strong> (Система малых ЭВМ) и комплексы на базе <strong>М-6000</strong>. Многие из них были функциональными аналогами западных машин (в частности PDP-11).</p><h3>Аппаратная база</h3><ul><li><strong>М-6000</strong> — управляющие вычислительные комплексы.</li><li><strong>СМ-1, СМ-2</strong> — ранние модели семейства.</li><li><strong>СМ-3, СМ-4</strong> — наиболее массовые 16-разрядные мини-ЭВМ с интерфейсом «Общая шина» (аналог Unibus).</li></ul><h3>Основные операционные системы</h3><ul><li><strong>ОУС</strong> (Основная управляющая система) — однозадачный режим работы.</li><li><strong>ДОС АСПО</strong> / дисковые ОС из пакета АСПО — подготовка, отладка и выполнение программ в пакетном и диалоговом режимах.</li><li><strong>ДОС РВ / ДОСРВ</strong> (Дисковая операционная система реального времени) — одновременная работа в многозадачном режиме реального времени и диалогово-пакетной обработке.</li><li><strong>ОС РВ / ОСРВ</strong> (Операционная система реального времени) и её модификации (ОСРВ-3, ОСРВ-4, СРВ, СРВ-М) — многозадачные системы реального времени, способные обслуживать десятки задач с приоритетами.</li><li>Также существовали ПЛОС, РАФОС, ДОС КП, ДЕМОС-16 (UNIX-подобная) и другие специализированные системы.</li></ul><p>Эти ОС обеспечивали управление технологическими процессами, научные расчёты, системы сбора данных и были важной частью промышленной и военной автоматизации СССР.</p>` },
        en: { title: "📜 Operating systems of USSR-era minicomputers", body: `<p>In the 1970s–80s the USSR widely used minicomputers of the <strong>SM EVM</strong> family (System of Small Computers) and systems based on the <strong>M-6000</strong>. Many were functional analogues of Western machines (notably the PDP-11).</p><h3>Hardware base</h3><ul><li><strong>M-6000</strong> — control computing complexes.</li><li><strong>SM-1, SM-2</strong> — early models of the family.</li><li><strong>SM-3, SM-4</strong> — the most widespread 16-bit minicomputers with the “Common Bus” interface (Unibus analogue).</li></ul><h3>Main operating systems</h3><ul><li><strong>OUS</strong> (Basic Control System) — single-task mode.</li><li><strong>DOS ASPO</strong> / disk OSes from the ASPO package — program preparation, debugging and execution in batch and interactive modes.</li><li><strong>DOS RV / DOSRV</strong> (Disk Real-Time Operating System) — simultaneous multi-task real-time operation and interactive/batch processing.</li><li><strong>OS RV / OSRV</strong> (Real-Time Operating System) and its variants (OSRV-3, OSRV-4, SRV, SRV-M) — multi-task real-time systems capable of handling dozens of prioritized tasks.</li><li>Other systems included PLOS, RAFOS, DOS KP, DEMOS-16 (UNIX-like) and various specialized OSes.</li></ul><p>These operating systems controlled industrial processes, scientific calculations and data-acquisition systems and formed an important part of Soviet industrial and military automation.</p>` }

    web: {
        uk: { title: "🌐 Найпопулярніші WEB-сервери (стан на 2026)", body: `
<p>WEB-сервер — програмне забезпечення, яке приймає HTTP-запити і віддає веб-сторінки, API та статичні ресурси. Нижче — лідери ринку за даними незалежних досліджень 2026 року, з коротким описом і посиланнями на завантаження.</p>
<h3>Nginx</h3>
<p>Лідер за часткою сайтів і високонавантажених сервісів. Легкий, швидкий, відмінно працює як HTTP-сервер, reverse proxy, балансувальник навантаження та кеш. Відкритий код (2-clause BSD).</p>
<p>Завантаження: <a href="https://nginx.org/en/download.html" target="_blank" rel="noopener">nginx.org/en/download.html</a> · Документація: <a href="https://nginx.org/en/docs/" target="_blank" rel="noopener">nginx.org/en/docs</a></p>
<h3>Apache HTTP Server</h3>
<p>Класика з величезною кількістю модулів і гнучкою конфігурацією (.htaccess). Досі дуже поширений у shared-хостингу та legacy-проектах.</p>
<p>Завантаження: <a href="https://httpd.apache.org/download.cgi" target="_blank" rel="noopener">httpd.apache.org/download.cgi</a></p>
<h3>Cloudflare (edge / reverse proxy)</h3>
<p>Не класичний «завантажуваний» сервер, а глобальна edge-мережа: CDN, WAF, DDoS-захист, reverse proxy. Багато сайтів працюють «за» Cloudflare.</p>
<p>Сервіс: <a href="https://www.cloudflare.com" target="_blank" rel="noopener">cloudflare.com</a></p>
<h3>LiteSpeed Web Server</h3>
<p>Популярний у shared-хостингу (часто з cPanel/DirectAdmin), висока продуктивність, сумісність з Apache-конфігами, HTTP/3 out of the box. Є OpenLiteSpeed (безкоштовна гілка).</p>
<p>Завантаження: <a href="https://www.litespeedtech.com/products/litespeed-web-server/download" target="_blank" rel="noopener">litespeedtech.com (LSWS)</a> · OpenLiteSpeed: <a href="https://openlitespeed.org/kb/install-ols-from-litespeed-repositories/" target="_blank" rel="noopener">openlitespeed.org</a></p>

<p>Документація та встановлення: <a href="https://www.iis.net" target="_blank" rel="noopener">iis.net</a></p>
<h3>OpenResty</h3>
<p>Платформа на базі Nginx + LuaJIT: зручна для API-шлюзів, динамічної логіки на edge, WAF-правил.</p>
<p>Завантаження: <a href="https://openresty.org/en/download.html" target="_blank" rel="noopener">openresty.org/en/download.html</a></p>
<h3>Caddy</h3>
<p>Сучасний веб-сервер з автоматичним HTTPS (Let’s Encrypt), простим конфігом і хорошою продуктивністю. Зручний для швидкого деплою.</p>
<p>Завантаження: <a href="https://caddyserver.com/download" target="_blank" rel="noopener">caddyserver.com/download</a></p>

<p>Тенденція 2020-х: Nginx і edge-рішення (Cloudflare) продовжують зростати; Apache зберігає сильні позиції; Caddy та OpenLiteSpeed набирають популярності серед розробників і хостерів.</p>

let currentLang = localStorage.getItem('os-dir-lang') || 'uk';
let activeCategory = 'all';

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('os-dir-lang', lang);
    document.documentElement.lang = lang === 'uk' ? 'uk' : (lang === 'ru' ? 'ru' : 'en');
    ['uk','ru','en'].forEach(l => document.getElementById('btn-'+l).classList.toggle('active', l===lang));
    document.title = ui[lang].title;
    document.getElementById('home-link').textContent = ui[lang].home;
    document.getElementById('page-title').textContent = ui[lang].pageTitle;
    renderFilters();
    render();
}

function toggleTheme() {
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    html.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
    localStorage.setItem('theme', cur === 'light' ? 'dark' : 'light');
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

function renderFilters() {
    const container = document.getElementById('filters');
    let html = `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="setCat('all')">${ui[currentLang].all}</button>`;
    for (const [key, val] of Object.entries(categories)) {
        html += `<button class="filter-btn ${activeCategory===key?'active':''}" onclick="setCat('${key}')">${val[currentLang]}</button>`;
    }
    // Додаткові розділи (та сама логіка, що й категорії ОС)
    const extras = [
        ['msdos', ui[currentLang].navMsdos],
        ['sov', ui[currentLang].navSov],
        ['web', ui[currentLang].navWeb],
        ['future', ui[currentLang].navFuture]
    ];
    extras.forEach(([key, label]) => {
        html += `<button class="filter-btn ${activeCategory===key?'active':''}" onclick="setCat('${key}')">${label}</button>`;
    });
    container.innerHTML = html;
}

function setCat(cat) {
    activeCategory = cat;
    renderFilters();
    render();
}

function getLicenseClass(lic) {
    const l = lic.toLowerCase();
    if (l.includes('безкоштовна') || l.includes('бесплатная') || l.includes('free') || l.includes('open source') || l.includes('bsd') || l.includes('mit') || l.includes('gpl')) return 'license-free';
    if (l.includes('платна') || l.includes('платная') || l.includes('paid')) return 'license-paid';
    return 'license-mix';
}

function render() {
    const main = document.getElementById('main');
    let html = '';

    // Додаткові розділи (історія, WEB, прогноз)
    const extraMap = { msdos: 'msdos', sov: 'sov', web: 'web', future: 'future' };
    if (extraMap[activeCategory]) {
        const key = extraMap[activeCategory];
        const block = extraContent[key][currentLang];
        html = `<div class="extra-section"><h2>${block.title}</h2>${block.body}</div>`;
        main.innerHTML = html;
        document.getElementById('footer').textContent = ui[currentLang].footer;
        return;
    }

    const catsToShow = activeCategory === 'all' ? Object.keys(categories) : [activeCategory];
    catsToShow.forEach(catKey => {
        const catOS = osList.filter(o => o.cat === catKey);
        if (catOS.length === 0) return;
        html += `<div class="section-title">${categories[catKey][currentLang]}</div><div class="grid">`;
        catOS.forEach(o => {
            const licClass = getLicenseClass(o.license[currentLang]);
            html += `<div class="card"><div class="card-header"><div class="card-icon">${o.icon}</div><div><div class="card-title">${o.name}</div></div></div><div class="card-desc">${o.desc[currentLang]}</div><div class="card-section"><strong>${ui[currentLang].features}</strong>${o.features[currentLang]}</div><div class="card-section"><strong>${ui[currentLang].license}</strong><span class="${licClass}">${o.license[currentLang]}</span></div><div class="card-section"><strong>${ui[currentLang].arch}</strong><div class="arch-tags">${o.arch.map(a => `<span class="arch-tag">${a}</span>`).join('')}</div></div><a href="${o.url}" target="_blank" class="card-link">${ui[currentLang].open}</a></div>`;
        });
        html += `</div>`;
    });
    if (html === '') html = `<div class="no-results">${ui[currentLang].noResults}</div>`;
    main.innerHTML = html;
    document.getElementById('footer').textContent = ui[currentLang].footer;
}

setLang(currentLang);
</script>
