<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DB Directory — Довідник СУБД</title>
    <style>
        :root {
            --bg: #0a0a12;
            --surface: #12121f;
            --surface-hover: #1a1a2e;
            --card: #16162a;
            --text: #f0f0f5;
            --text-muted: #8b8ba3;
            --accent: #00e5b0;
            --accent-2: #7c3aed;
            --accent-3: #ff9f43;
            --gradient: linear-gradient(135deg, #00e5b0, #7c3aed);
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --radius: 1rem;
        }
        [data-theme="light"] {
            --bg: #f4f6fb;
            --surface: #ffffff;
            --surface-hover: #f0f2f8;
            --card: #ffffff;
            --text: #0f0f1a;
            --text-muted: #5a5a70;
            --shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background: var(--surface);
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding: 1.2rem 5%;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        [data-theme="light"] header { border-bottom: 1px solid rgba(0,0,0,0.06); }
        .header-top {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-left {
            display: flex;
            align-items: center;
        }
        .home-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 700;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: opacity 0.2s;
        }
        .home-link:hover { opacity: 0.8; }
        
        .page-title-center {
            flex: 1;
            text-align: center;
            font-size: 1.15rem;
            font-weight: 700;
            color: var(--text);
            padding: 0 1rem;
            line-height: 1.3;
        }
        .page-title-center .sub {
            display: block;
            font-size: 0.85rem;
            font-weight: 400;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .controls { display: flex; align-items: center; gap: 0.8rem; }
        .lang-switcher {
            display: flex; background: var(--surface-hover); border-radius: 2rem; padding: 3px;
        }
        .lang-switcher button {
            background: transparent; border: none; color: var(--text-muted);
            padding: 0.35rem 0.7rem; border-radius: 2rem; cursor: pointer;
            font-size: 0.75rem; font-weight: 700; transition: 0.2s;
        }
        .lang-switcher button.active { background: var(--accent); color: #000; }
        .theme-btn {
            width: 36px; height: 36px; border-radius: 50%; border: none;
            background: var(--surface-hover); color: var(--text); cursor: pointer;
            font-size: 1rem; transition: 0.2s;
        }
        .theme-btn:hover { transform: scale(1.1); }


        .filters {
            max-width: 1200px; margin: 1rem auto; padding: 0 5%;
            display: flex; gap: 0.5rem; flex-wrap: wrap; justify-content: center;
        }
        .filter-btn {
            padding: 0.5rem 1rem; border-radius: 2rem; border: 1px solid rgba(255,255,255,0.08);
            background: var(--surface); color: var(--text-muted); cursor: pointer;
            font-size: 0.85rem; font-weight: 600; transition: 0.2s; white-space: nowrap;
        }
        .filter-btn:hover, .filter-btn.active {
            background: var(--accent); color: #000; border-color: var(--accent);
        }

        main {
            max-width: 1200px; margin: 0 auto; padding: 1.5rem 5% 4rem;
        }
        .section-title {
            font-size: 1.3rem; font-weight: 700; margin: 2rem 0 1rem;
            display: flex; align-items: center; gap: 0.5rem;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 1rem;
        }
        .card, .content-section {
            background: var(--card);
            border: 1px solid rgba(255,255,255,0.04);
            border-radius: var(--radius);
            padding: 1.3rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex; flex-direction: column;
        }
        .content-section { margin-bottom: 2rem; }
        [data-theme="light"] .card, [data-theme="light"] .content-section { border-color: rgba(0,0,0,0.06); }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow);
            border-color: rgba(0,229,176,0.2);
        }
        .card-header {
            display: flex; align-items: center; gap: 0.8rem; margin-bottom: 0.7rem;
        }
        .card-icon {
            width: 44px; height: 44px; border-radius: 10px;
            background: var(--surface-hover);
            display: flex; align-items: center; justify-content: center;
            font-size: 1.4rem; flex-shrink: 0;
        }
        .card-title {
            font-weight: 700; font-size: 1.05rem;
        }
        .card-desc {
            color: var(--text-muted); font-size: 0.9rem;
            line-height: 1.5; margin-bottom: 0.3rem;
        }
        .card-section {
            margin-top: 0.7rem;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
        .card-section strong {
            color: var(--text);
            display: block;
            margin-bottom: 0.15rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .query-tag {
            display: inline-block;
            background: rgba(124,58,237,0.1); color: var(--accent-2);
            padding: 0.15rem 0.5rem; border-radius: 0.5rem;
            font-size: 0.75rem; font-weight: 600; margin-top: 0.2rem;
        }
        .card-link {
            display: inline-flex; align-items: center; gap: 0.4rem;
            color: var(--accent); text-decoration: none;
            font-weight: 600; font-size: 0.85rem;
            transition: gap 0.2s; margin-top: 0.8rem;
        }
        .card-link:hover { gap: 0.7rem; }
        .card-link::after { content: "→"; }

        .license-free { color: #00e5b0; }
        .license-paid { color: #ff9f43; }
        .license-mix { color: #7c3aed; }

        .no-results {
            text-align: center; color: var(--text-muted);
            padding: 3rem; font-size: 1.1rem; grid-column: 1 / -1;
        }

        footer {
            text-align: center; padding: 2rem; color: var(--text-muted);
            border-top: 1px solid rgba(255,255,255,0.04); font-size: 0.85rem;
        }

        @media (max-width: 640px) {
            .grid { grid-template-columns: 1fr; }
            .header-top { flex-direction: column; align-items: flex-start; }
            .page-title-center { text-align: left; padding: 0.5rem 0; }
            .controls { align-self: flex-end; margin-top: -3rem; }
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg); }
        ::-webkit-scrollbar-thumb { background: var(--surface-hover); border-radius: 4px; }
    </style>
</head>

<header>
    <div class="header-top">

        </div>
        <div class="page-title-center" id="page-title">

            </div>
            <button class="theme-btn" onclick="toggleTheme()">🌓</button>

</header>

<main id="main"></main>

<footer id="footer"></footer>

let currentLang = localStorage.getItem('db-dir-lang') || 'uk';
let activeCategory = 'all';

function setLang(lang) {
    currentLang = lang;
    localStorage.setItem('db-dir-lang', lang);
    document.documentElement.lang = lang === 'uk' ? 'uk' : (lang === 'ru' ? 'ru' : 'en');
    ['uk','ru','en'].forEach(l => document.getElementById('btn-'+l).classList.toggle('active', l===lang));
    document.title = ui[lang].title;
    
    document.getElementById('page-title').innerHTML = `
        ${ui[lang].pageTitle}
        <span class="sub">${ui[lang].pageTitleSub}</span>
    `;
    
    renderFilters();
    render();
}

function toggleTheme() {
    const html = document.documentElement;
    const cur = html.getAttribute('data-theme');
    html.setAttribute('data-theme', cur === 'light' ? 'dark' : 'light');
    localStorage.setItem('theme', cur === 'light' ? 'dark' : 'light');
}
document.documentElement.setAttribute('data-theme', localStorage.getItem('theme') || 'dark');

function renderFilters() {
    const container = document.getElementById('filters');
    let html = `<button class="filter-btn ${activeCategory==='all'?'active':''}" onclick="setCat('all')">${ui[currentLang].all}</button>`;
    for (const [key, val] of Object.entries(categories)) {
        html += `<button class="filter-btn ${activeCategory===key?'active':''}" onclick="setCat('${key}')">${val[currentLang]}</button>`;
    }
    container.innerHTML = html;
}

function setCat(cat) {
    activeCategory = cat;
    renderFilters();
    render();
}

function getLicenseClass(lic) {
    const l = lic.toLowerCase();
    if (l.includes('безкоштовна') || l.includes('бесплатная') || l.includes('free') || l.includes('open source') || l.includes('bsd') || l.includes('mit') || l.includes('gpl') || l.includes('apache') || l.includes('public domain') || l.includes('sspl')) return 'license-free';
    if (l.includes('платна') || l.includes('платная') || l.includes('paid')) return 'license-paid';
    return 'license-mix';
}

        const catsToShow = activeCategory === 'all'

        let hasResults = false;

        catsToShow.forEach(catKey => {
            const catDB = dbList.filter(d => d.cat === catKey);

            html += `<div class="section-title">${categories[catKey][currentLang]}</div>`;

            catDB.forEach(d => {

    document.getElementById('footer').textContent = ui[currentLang].footer;
}
